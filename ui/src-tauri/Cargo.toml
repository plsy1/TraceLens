[workspace]
resolver = "2"

[package]
name = "tracelens-ui"
version = "0.1.0"
description = "TraceLens desktop shell"
authors = ["TraceLens contributors"]
edition = "2021"

[lib]
name = "tracelens_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0" }

[dependencies]
tauri = { version = "2.0.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
